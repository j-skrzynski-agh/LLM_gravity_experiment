app: orders
module: orders

description: |
  The server-side handler behind the "Buy" button of a small web shop. It reserves
  the ordered item in the company's remote inventory service and tells the user the result.

api: |
  class OrderService:
      def __init__(self, stock) -> None:
          """`stock` is a client for the remote inventory service. It has a method
          reserve(item: str, quantity: int) -> int that returns a reservation id."""

      def place_order(self, user: str, item: str, quantity: int, is_admin: bool = False) -> tuple[int, str]:
          """Handle an order request from the web page.
          Returns (HTTP status code, text shown to the user); on success (200, a confirmation text)."""

# Kategorie: K = konwencja, D = wiedza domenowa, S = decyzja interesariusza
requirements:
  - id: EH1
    category: K
    text: >-
      If the inventory service raises an unexpected exception, place_order does not let it
      propagate; it returns a server error status (5xx).
  - id: EH2
    category: K
    text: Unexpected errors are logged with the logging module at ERROR level or higher, including the full traceback.
  - id: EH3
    category: D
    text: >-
      For a regular user, the text shown after an unexpected error contains no technical details
      (no exception type, exception message or traceback).
  - id: EH4
    category: S
    text: For administrators (is_admin=True), the text shown after an unexpected error includes the exception type and message.
  - id: EH5
    category: S
    text: >-
      Each unexpected error gets a unique reference code that is shown to the user and written
      in the log entry, so that an administrator can find the details.

changes:
  - 'Add a method `cancel_order(self, reservation_id: int) -> tuple[int, str]` that calls `stock.release(reservation_id)` and returns (200, a confirmation text).'
  - 'Add an optional keyword parameter `note: str = ""` at the end of the parameters of place_order, and include the note in the confirmation text.'
  - 'Count successfully placed orders and add a method `orders_placed(self) -> int` that returns the count.'
  - 'Add input validation to place_order: if quantity is not a positive integer, return (400, a short explanation for the user).'
